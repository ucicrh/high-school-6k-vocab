、有生氣的", "The fish is still alive.（那條魚還活著。）"], ["all", "adj./adv./n./pron.", 1, "全部的；完全地；全部、一切；全部的人（物）", "All the students passed the test.（所有學生都通過了考試。）"], ["allege", "v.", 6, "宣稱、指稱", "The man is alleged to have taken the money.（據稱那名男子拿了這筆錢。）"], ["allergic", "adj.", 5, "過敏的", "I am allergic to peanuts.（我對花生過敏。）"], ["allergy", "n.", 5, "過敏症", "She has an allergy to cats.（她對貓過敏。）"], ["alley", "n.", 3, "小巷、巷弄", "A cat ran into the narrow alley.（一隻貓跑進了狹窄的小巷。）"], ["alliance", "n.", 5, "聯盟、結盟", "The two countries formed an alliance.（兩國結成了聯盟。）"], ["alligator", "n.", 6, "短吻鱷、鱷魚", "An alligator lay still in the river.（一隻鱷魚靜靜地躺在河裡。）"], ["allocate", "v.", 5, "分配、撥給", "The school allocated money for new books.（學校撥款購買新書。）"], ["allow", "v.", 1, "允許、讓", "My mother does not allow me to stay out late.（我媽媽不讓我很晚在外面。）"], ["allowance", "n.", 4, "零用錢、津貼", "I get a weekly allowance from my parents.（我每週從父母那裡拿零用錢。）"], ["ally", "n./v.", 5, "盟友；結盟", "France was an ally of the United States.（法國曾是美國的盟友。）"], ["almond", "n.", 3, "杏仁", "She added chopped almonds to the cake.（她在蛋糕裡加了切碎的杏仁。）"], ["almost", "adv.", 1, "幾乎、差不多", "I am almost ready to leave.（我差不多準備好要出發了。）"], ["alone", "adj./adv.", 2, "獨自的；獨自地", "He lives alone in a small apartment.（他獨自住在一間小公寓。）"], ["along", "adv./prep.", 1, "沿著；一起、向前", "We walked along the river.（我們沿著河邊走。）"], ["alongside", "adv./prep.", 5, "在旁邊；在……旁邊、與……並排", "The boat pulled up alongside the dock.（船停靠在碼頭旁。）"], ["aloud", "adv.", 2, "出聲地、大聲地", "The teacher asked him to read the story aloud.（老師要他大聲朗讀這個故事。）"], ["alphabet", "n.", 3, "字母表", "There are twenty-six letters in the English alphabet.（英文字母表有二十六個字母。）"], ["already", "adv.", 1, "已經", "I have already finished my homework.（我已經寫完作業了。）"], ["also", "adv.", 1, "也、而且", "She speaks English and also French.（她會說英文，也會說法文。）"], ["alter", "v.", 5, "改變、更改", "She altered the dress to make it shorter.（她改了那件洋裝，讓它變短。）"], ["alternate", "adj./n./v.", 5, "交替的、輪流的；代替者；輪流、交替", "We take alternate weeks cleaning the kitchen.（我們隔週輪流打掃廚房。）"], ["a ver the loudspeaker.（這項公告是透過擴音器播報的。）"], ["annoy", "v.", 4, "使惱怒、打擾", "Loud music annoys me when I study.（我讀書時，大聲的音樂讓我很煩。）"], ["annoyance", "n.", 6, "惱怒、令人厭煩的事", "The noise is a constant annoyance.（這種噪音一直讓人很煩。）"], ["annual", "adj.", 4, "每年的、年度的", "The school holds an annual sports day.（學校舉辦年度運動會。）"], ["anonymous", "adj.", 5, "匿名的、無名的", "The gift was from an anonymous friend.（這份禮物來自一位匿名的朋友。）"], ["another", "adj./pron.", 1, "另一個的；另一個", "Would you like another cup of tea?（你要再來一杯茶嗎？）"], ["answer", "n./v.", 1, "回答、答案；回答", "Please answer the question.（請回答這個問題。）"], ["ant", "n.", 1, "螞蟻", "An ant carried a crumb across the floor.（一隻螞蟻搬著碎屑走過地板。）"], ["anthem", "n.", 6, "國歌、讚美詩", "The crowd stood up and sang the national anthem.（群眾起立高唱國歌。）"], ["antibiotic", "adj./n.", 6, "抗生素的；抗生素", "The doctor gave her an antibiotic for the infection.（醫生開了抗生素給她治療感染。）"], ["anticipate", "v.", 5, "預期、期待", "We anticipate a large crowd at the concert.（我們預期音樂會會有大批觀眾。）"], ["anticipation", "n.", 6, "期待、預期", "The children waited in anticipation of the holiday.（孩子們滿心期待地等待假期到來。）"], ["antique", "adj./n.", 5, "古董的；古董", "She collects antique furniture.（她收藏古董家具。）"], ["antonym", "n.", 6, "反義詞", "\"Hot\" is the antonym of \"cold\".（「hot」是「cold」的反義詞。）"], ["anxiety", "n.", 4, "焦慮、擔心", "He felt anxiety before the exam.（他在考試前感到焦慮。）"], ["anxious", "adj.", 3, "焦慮的、擔心的、渴望的", "She is anxious about her test results.（她擔心自己的考試成績。）"], ["any", "adj./adv./pron.", 1, "任何的；絲毫；任何一個", "Do you have any questions?（你有任何問題嗎？）"], ["anybody", "pron.", 1, "任何人", "Is anybody home?（有人在家嗎？）"], ["anyhow", "adv.", 3, "無論如何、隨便地", "I was tired, but I went to the party anyhow.（我很累，但還是去參加了派對。）"], ["anyone", "pron.", 1, "任何人", "Anyone can join the club.（任何人都可以加入這個社團。）"], ["anyplace", "adv.", 2, "任何地方", "You can sit anyplace you like.（你喜歡坐哪裡都可以。）"], ["anything", "pron.", 1, "任何事物", "I will do anything to help you.（我願意做任何事來幫你。）"], ["anytime", "adv.", 2, "隨時", "You can call me anytime.（你可以隨時打電話給我。）"], ["anyway", "adv.", 2, "無論如何、反正", "It may rain, but we will go anyway.（可能會下雨，但我們還是會去。）"], ["anywhere", "adv.", 2, "任何地方", "I cannot find my keys anywhere.（我到處都找不到我的鑰匙。）"], ["apart", "adv.", 3, "分開地、相隔", "The two towns are ten miles apart.（這兩個小鎮相距十英里。）"], ["apartment", "n.", 1, "公寓", "They live in a small apartment downtown.（他們住在市中心的一間小公寓。）"], ["ape", "n.", 2, "猿、猩猩", "The ape climbed up the tree.（那隻猿爬上了樹。）"], ["apologize", "v.", 3, "道歉、認錯", "You should apologize for being late.（你應該為遲到道歉。）"], ["apology", "n.", 4, "道歉、歉意", "He made an apology to his teacher.（他向老師道歉。）"], ["apparent", "adj.", 4, "明顯的、顯而易見的", "It was apparent that she was upset.（很明顯她心情不好。）"], ["appeal", "n./v.", 3, "吸引力、呼籲；呼籲、上訴、吸引", "The beach has a lot of appeal for tourists.（這片海灘對遊客很有吸引力。）"], ["appear", "v.", 1, "出現、似乎", "A rainbow appeared in the sky.（天空出現了一道彩虹。）"], ["appearance", "n.", 2, "外表、出現", "She cares a lot about her appearance.（她很在意自己的外表。）"], ["appetite", "n.", 2, "食慾、胃口", "I have no appetite today.（我今天沒有胃口。）"], ["applaud", "v.", 6, "鼓掌、讚許", "The audience applauded the singer.（觀眾為那位歌手鼓掌。）"], ["applause", "n.", 5, "掌聲、喝采", "The actors received loud applause.（演員們獲得熱烈的掌聲。）"], ["apple", "n.", 1, "蘋果", "An apple a day keeps the doctor away.（一天一蘋果，醫生遠離我。）"], ["appliance", "n.", 5, "家電用品、器具", "We bought a new kitchen appliance.（我們買了一件新的廚房電器。）"], ["applicable", "adj.", 6, "適用的、適當的", "The rule is not applicable to children.（這項規定不適用於兒童。）"], ["applicant", "n.", 4, "申請人、應徵者", "There were fifty applicants for the job.（這份工作有五十位應徵者。）"], ["application", "n.", 4, "申請、應用、應用程式", "Please fill out the application form.（請填寫申請表。）"], ["apply", "v.", 2, "申請、應用、塗抹", "She applied for a job at the library.（她申請了圖書館的工作。）"], ["appoint", "v.", 4, "任命、指派", "They appointed him captain of the team.（他們任命他為隊長。）"], ["appointment", "n.", 4, "約會、預約、任命", "I have a dentist appointment at three o'clock.（我三點有牙醫的預約。）"], ["appreciate", "v.", 2, "欣賞、感激、體會", "I really appreciate your help.（我真的很感激你的幫忙。）"], ["appreciation", "n.", 4, "欣賞、感激", "She showed her appreciation with a small gif nd money.（他在時間和金錢上都很大方。）"], ["genetic", "adj.", 5, "基因的、遺傳的", "Some diseases are genetic.（有些疾病是遺傳的。）"], ["genetics", "n.", 5, "遺傳學", "She studies genetics at the university.（她在大學研讀遺傳學。）"], ["genius", "n.", 4, "天才、天賦", "Einstein was a genius.（愛因斯坦是個天才。）"], ["genre", "n.", 5, "類型、體裁", "Science fiction is my favorite genre of movie.（科幻片是我最喜歡的電影類型。）"], ["gentle", "adj.", 2, "溫和的、輕柔的", "The nurse has a gentle voice.（那位護士聲音很溫柔。）"], ["gentleman", "n.", 2, "紳士、先生", "He is a true gentleman who always helps others.（他是真正的紳士，總是幫助別人。）"], ["genuine", "adj.", 4, "真正的、真誠的", "This is a genuine leather bag.（這是一個真皮包。）"], ["geographical", "adj.", 6, "地理的", "The country has a good geographical position for trade.（這個國家的地理位置有利於貿易。）"], ["geography", "n.", 3, "地理學", "We learned about rivers in geography class.（我們在地理課學到有關河流的知識。）"], ["geometry", "n.", 6, "幾何學", "Geometry deals with shapes and angles.（幾何學探討形狀與角度。）"], ["germ", "n.", 4, "細菌、病菌", "Wash your hands to kill germs.（洗手可以殺死細菌。）"], ["gesture", "n./v.", 3, "手勢、姿態；做手勢、示意", "She made a gesture to ask us to be quiet.（她做了個手勢要我們安靜。）"], ["get", "v.", 1, "得到、取得；變得；抵達", "I will get some milk from the store.（我會去商店買些牛奶。）"], ["ghost", "n.", 1, "鬼、幽靈", "Children love telling ghost stories on Halloween.（孩子們喜歡在萬聖節講鬼故事。）"], ["giant", "adj./n.", 1, "巨大的；巨人", "The giant ate the whole cake in one bite.（那個巨人一口吃掉了整個蛋糕。）"], ["gift", "n.", 1, "禮物、天賦", "I bought a gift for my mother's birthday.（我為媽媽的生日買了一份禮物。）"], ["gifted", "adj.", 4, "有天賦的、有才能的", "She is a gifted piano player.（她是個有天賦的鋼琴家。）"], ["gigantic", "adj.", 4, "巨大的、龐大的", "A gigantic wave hit the shore.（一個巨大的浪打上岸。）"], ["giggle", "n./v.", 4, "咯咯笑聲；咯咯地笑", "The girls burst into giggles.（女孩們突然咯咯笑起來。）"], ["ginger", "n.", 4, "薑", "Add some ginger to the soup.（在湯裡加一些薑。）"], ["giraffe", "n.", 2, "長頸鹿", "The giraffe has a very long neck.（長頸鹿的脖子很長。）"], ["girl", "n.", 1, "女孩", "The girl is reading a book under the tree.（那個女孩正在樹下看書。）"], ["give", "v.", 1, "給、給予", "Please give me a glass of water.（請給我一杯水。）"], ["glacier 。）"], ["narrative", "adj./n.", 5, "adj. 敘事的；n. 敘述、故事", "The author wrote a narrative about her childhood.（作者寫了一篇關於她童年的敘事。）"], ["narrator", "n.", 6, "n. 敘述者、旁白", "The narrator of the film has a calm voice.（這部電影的旁白聲音很沉穩。）"], ["narrow", "adj./v.", 2, "adj. 狹窄的；v. 變窄、縮小", "The street is too narrow for big cars.（這條街對大車來說太窄了。）"], ["nasty", "adj.", 5, "adj. 討厭的、惡劣的", "That was a nasty thing to say.（那句話說得很討人厭。）"], ["nation", "n.", 2, "n. 國家、民族", "Taiwan is a small island nation.（台灣是一個小島國。）"], ["national", "adj.", 1, "adj. 國家的、全國的", "The national flag hung outside the school.（國旗掛在學校外面。）"], ["nationalism", "n.", 6, "n. 民族主義、國家主義", "Extreme nationalism can cause conflict.（極端的民族主義可能引發衝突。）"], ["nationality", "n.", 4, "n. 國籍", "What is your nationality?（你的國籍是什麼？）"], ["native", "adj./n.", 3, "adj. 本土的、天生的；n. 本地人", "She is a native speaker of English.（她的母語是英語。）"], ["natural", "adj.", 2, "adj. 自然的、天然的", "I prefer natural food to processed food.（比起加工食品，我更喜歡天然食物。）"], ["nature", "n.", 1, "n. 大自然、本性", "We should protect nature.（我們應該保護大自然。）"], ["naughty", "adj.", 2, "adj. 頑皮的、淘氣的", "The naughty boy hid his sister's shoes.（那個頑皮的男孩把他姊姊的鞋子藏了起來。）"], ["navigate", "v.", 6, "v. 導航、航行", "We used a map to navigate through the city.（我們用地圖在城裡找路。）"], ["navigation", "n.", 6, "n. 導航、航行", "The car has a built-in navigation system.（這輛車有內建的導航系統。）"], ["navy", "n.", 3, "n. 海軍、深藍色", "His father serves in the navy.（他的父親在海軍服役。）"], ["near", "adj./adv./prep./v.", 1, "adj. 近的；adv. 接近；prep. 靠近；v. 接近", "The station is near my house.（車站離我家很近。）"], ["nearby", "adj./adv.", 2, "adj. 附近的；adv. 在附近", "There is a convenience store nearby.（附近有一家便利商店。）"], ["nearly", "adv.", 2, "adv. 幾乎、差不多", "It is nearly six o'clock.（現在差不多六點了。）"], ["nearsighted", "adj.", 6, "adj. 近視的", "He is nearsighted and wears glasses.（他近視，所以戴眼鏡。）"], ["neat", "adj.", 3, "adj. 整潔的、俐落的", "Her room is always neat and tidy.（她的房間總是整整齊齊。）"], ["necessary", "adj.", 2, "adj. 必要的、必需的", "Water is necessary for life.（水是生命必需的。）"], ["necessity", "n.", 3, "n. 必需品、必要性", "Food is a basic necessity of life.（食物是生活的基本必需品。）"], ["neck", "n.", 1, "n. 脖子", "She wore a scarf around her neck.（她脖子上圍著圍巾。）"], ["necklace", "n.", 2, "n. 項鍊", "He gave her a gold necklace.（他送她一條金項鍊。）"], ["necktie", "n.", 3, "n. 領帶", "My father wears a necktie to work.（我爸爸上班打領帶。）"], ["need", "aux./n./v.", 1, "aux. 需要；n. 需求；v. 需要", "You need to drink more water.（你需要多喝水。）"], ["needle", "n.", 2, "n. 針", "She threaded a needle to sew a button.（她穿好針線來縫釦子。）"], ["needy", "adj.", 4, "adj. 貧窮的、貧困的", "The charity helps needy families.（這個慈善機構幫助貧困家庭。）"], ["negative", "adj./n.", 2, "adj. 負面的、否定的；n. 底片、負面", "Don't be so negative about the plan.（別對這個計畫那麼悲觀。）"], ["neglect", "n./v.", 4, "n. 忽視、疏忽；v. 忽視、疏忽", "Don't neglect your health.（不要忽視你的健康。）"], ["negotiate", "v.", 4, "v. 談判、協商", "The two sides will negotiate a new contract.（雙方將就新合約進行談判。）"], ["negotiation", "n.", 5, "n. 談判、協商", "The negotiation lasted for three hours.（談判持續了三個小時。）"], ["neighbor", "n.", 2, "n. 鄰居", "My neighbor often waters my plants.（我的鄰居常常幫我澆花。）"], ["neighborhood", "n.", 3, "n. 鄰近地區、社區", "This is a quiet neighborhood.（這是個安靜的社區。）"], ["neither", "adj./adv./conj./pron.", 2, "adj. 兩者都不的；adv. 也不；conj. 也不；pron. 兩者都不", "Neither of my parents can swim.（我父母兩人都不會游泳。）"], ["nephew", "n.", 2, "n. 姪子、外甥", "My nephew is five years old.（我的姪子五歲。）"], ["nerve", "n.", 2, "n. 神經、勇氣", "The dentist's drill hurt a nerve.（牙醫的鑽頭弄痛了神經。）"], ["nervous", "adj.", 2, "adj. 緊張的、不安的", "I felt nervous before the speech.（演講前我感到很緊張。）"], ["nest", "n./v.", 3, "n. 巢、窩；v. 築巢", "A bird built a nest in the tree.（一隻鳥在樹上築了巢。）"], ["net", "n./v.", 1, "n. 網、淨額；v. 捕獲、淨賺", "The fisherman cast his net into the sea.（漁夫把網撒進海裡。）"], ["network", "n./v.", 2, "n. 網路、網絡；v. 建立人脈、聯網", "Our school has a fast wireless network.（我們學校有快速的無線網路。）"], ["neutral", "adj./n.", 5, "adj. 中立的、中性的；n. 中立國、空檔", "The country remained neutral during the war.（那個國家在戰爭期間保持中立。）"], ["never", "adv.", 1, "adv. 從不、絕不", "I never eat breakfast at school.（我從來不在學校吃早餐。）"], ["nevertheless", "adv.", 4, "adv. 然而、儘管如此", "It rained; nevertheless, we went out.（下雨了，儘管如此，我們還是出去了。）"], ["new", "adj.", 1, "adj. 新的", "I bought a new bike.（我買了一輛新腳踏車。）"], ["news", "n.", 1, "n. 新聞、消息", "I watch the news every evening.（我每天晚上看新聞。）"], ["newspaper", "n.", 1, "n. 報紙", "My grandfather reads the newspaper every morning.（我爺爺每天早上看報紙。）"], ["next", "adj./adv.", 1, "adj. 下一個的；adv. 接下來", "See you next week.（下週見。）"], ["nice", "adj.", 1, "adj. 好的、友善的", "She is a nice person.（她是個很好的人。）"], ["nickel", "n./v.", 6, "n. 鎳、五分硬幣；v. 鍍鎳", "A nickel is a coin worth five cents.（五分鎳幣是面值五美分的硬幣。）"], ["nickname", "n./v.", 3, "n. 綽號；v. 給……取綽號", "His nickname is \"Tiger.\"（他的綽號叫「老虎」。）"], ["niece", "n.", 2, "n. 姪女、外甥女", "My niece loves drawing.（我的姪女喜歡畫畫。）"], ["night", "n.", 1, "n. 夜晚、晚上", "The stars are bright at night.（夜裡星星很明亮。）"], ["nightmare", "n.", 4, "n. 惡夢", "I had a nightmare last night.（我昨晚做了惡夢。）"], ["no", "adj./adv./n.", 1, "adj. 沒有的；adv. 不；n. 否定、不", "No smoking is allowed here.（這裡禁止吸菸。）"], ["noble", "adj./n.", 4, "adj. 高尚的、貴族的；n. 貴族", "He is a noble man who helps the poor.（他是個幫助窮人的高尚之人。）"], ["nobody", "n./pron.", 1, "n. 無名小卒；pron. 沒有人", "Nobody knows the answer.（沒有人知道答案。）"], ["nod", "n./v.", 2, "n. 點頭；v. 點頭", "She nodded to show she agreed.（她點頭表示同意。）"], ["noise", "n.", 1, "n. 噪音、聲音", "The noise from the street kept me awake.（街上的噪音讓我睡不著。）"], ["noisy", "adj.", 1, "adj. 吵鬧的", "The classroom was very noisy.（教室非常吵。）"], ["nominate", "v.", 5, "v. 提名", "The class nominated Amy for president.（班上提名艾美為班長。）"], ["nomination", "n.", 5, "n. 提名", "She received a nomination for the award.（她獲得了該獎項的提名。）"], ["nominee", "n.", 5, "n. 被提名人", "The nominee gave a short speech.（被提名人發表了簡短的演說。）"], ["none", "adv./pron.", 2, "adv. 絲毫不；pron. 沒有一個、沒有任何", "None of the students were late.（沒有任何學生遲到。）"], ["nonprofit", "adj.", 5, "adj. 非營利的", "She works for a nonprofit organization.（她在一個非營利組織工作。）"], ["nonsense", "n.", 4, "n. 胡說、無意義的話", "Don't talk nonsense.（別胡說八道。）"], ["noodle", "n.", 2, "n. 麵條", "I had a bowl of beef noodles for lunch.（我午餐吃了一碗牛肉麵。）"], ["noon", "n.", 1, "n. 中午、正午", "We eat lunch at noon.（我們中午吃午餐。）"], ["nope", "adj./adv./n.", 1, "adj. 不（口語）；adv. 不；n. 不", "\"Do you like spinach?\" \"Nope.\"（「你喜歡菠菜嗎？」「不喜歡。」）"], ["nor", "conj.", 2, "conj. 也不", "He can't swim, nor can his sister.（他不會游泳，他姊姊也不會。）"], ["norm", "n.", 5, "n. 規範、標準", "Politeness is the norm in our school.（有禮貌是我們學校的常規。）"], ["normal", "adj.", 3, "adj. 正常的", "It is normal to feel nervous before a test.（考試前感到緊張是正常的。）"], ["north", "adj./adv./n.", 1, "adj. 北方的；adv. 向北；n. 北方", "Taipei is in the north of Taiwan.（台北位於台灣北部。）"], ["northern", "adj.", 2, "adj. 北方的、北部的", "Northern Taiwan gets a lot of rain in winter.（北台灣冬天雨量很多。）"], ["nose", "n.", 1, "n. 鼻子", "She has a small nose.（她有個小鼻子。）"], ["nostril", "n.", 6, "n. 鼻孔", "The cold air made his nostrils sting.（冷空氣讓他的鼻孔刺痛。）"], ["not", "adv.", 1, "adv. 不", "I do not like cold weather.（我不喜歡寒冷的天氣。）"], ["notable", "adj./n.", 6, "adj. 顯著的、值得注意的；n. 名人、要人", "The scientist is notable for her discoveries.（那位科學家因她的發現而聞名。）"], ["note", "n./v.", 1, "n. 筆記、便條；v. 注意、記下", "Please take notes in class.（上課時請做筆記。）"], ["notebook", "n.", 2, "n. 筆記本", "I write new words in my notebook.（我把新單字寫在筆記本裡。）"], ["nothing", "n./pron.", 1, "n. 沒有東西；pron. 沒什麼", "There is nothing in the box.（盒子裡什麼都沒有。）"], ["notice", "n./v.", 1, "n. 通知、公告；v. 注意到", "I didn't notice the sign.（我沒注意到那個標誌。）"], ["noticeable", "adj.", 5, "adj. 明顯的、顯而易見的", "There is a noticeable difference between them.（它們之間有明顯的差異。）"], ["notify", "v.", 5, "v. 通知、通告", "Please notify me when the package arrives.（包裹到的時候請通知我。）"], ["notion", "n.", 5, "n. 觀念、想法", "He has no notion of how to cook.（他完全不懂怎麼煮菜。）"], ["notorious", "adj.", 6, "adj. 惡名昭彰的", "The city was notorious for its traffic.（這座城市以交通糟糕而惡名昭彰。）"], ["nourish", "v.", 6, "v. 滋養、養育", "Good food nourishes the body.（好的食物滋養身體。）"], ["nourishment", "n.", 6, "n. 營養、養分、食物", "Plants get nourishment from the soil.（植物從土壤中獲得養分。）"], ["novel", "adj./n.", 2, "adj. 新奇的、新穎的；n. 小說", "She is reading a novel by a Taiwanese author.（她正在讀一 .", 2, "v. 發生、出現", "When did the accident occur?（那場意外是什麼時候發生的？）"], ["occurrence", "n.", 6, "n. 發生、出現的事件", "Earthquakes are a common occurrence in Taiwan.（地震在台灣是常見的事。）"], ["ocean", "n.", 2, "n. 海洋", "The ship crossed the ocean.（那艘船橫渡了海洋。）"], ["octopus", "n.", 6, "n. 章魚", "An octopus has eight arms.（章魚有八隻觸手。）"], ["odd", "adj.", 3, "adj. 奇怪的、古怪的、奇數的", "It is odd that he is not here yet.（很奇怪他還沒到。）"], ["odds", "n.", 5, "n. 機率、可能性、賠率", "The odds of winning are very low.（獲勝的機率很低。）"], ["odor", "n.", 6, "n. 氣味、臭味", "There was a strange odor in the room.（房間裡有一股奇怪的氣味。）"], ["of", "prep.", 1, "prep. 的、屬於、……之中", "She is a friend of mine.（她是我的一位朋友。）"], ["off", "adj./adv./prep.", 1, "adj. 關閉的、休息的；adv. 離開；prep. 離開、從……下來", "Please turn off the lights.（請把燈關掉。）"], ["offend", "v.", 4, "v. 冒犯、觸怒", "I didn't mean to offend you.（我無意冒犯你。）"], ["offense", "n.", 4, "n. 冒犯、犯罪、攻擊", "Speeding is a traffic offense.（超速是違反交通規則的行為。）"], ["offensive", "adj.", 4, "adj. 冒犯的、無禮的、攻擊的", "His joke was offensive to many people.（他的笑話冒犯了許多人。）"], ["offer", "n./v.", 2, "n. 提議、出價；v. 提供、提出", "She offered me a cup of tea.（她請我喝了一杯茶。）"], ["offering", "n.", 5, "n. 供品、奉獻物、提供", "People left offerings at the temple.（人們在寺廟裡留下供品。）"], ["office", "n.", 1, "n. 辦公室", "My mother works in an office.（我媽媽在辦公室工作。）"], ["officer", "n.", 1, "n. 官員、警察", "The officer asked to see my ID.（那名警官要求看我的身分證。）"], ["official", "adj./n.", 2, "adj. 官方的、正式的；n. 官員", "The official language of Taiwan is Mandarin.（台灣的官方語言是華語。）"], ["offshore", "adj.", 6, "adj. 離岸的、海外的", "The company has an offshore factory.（這家公司有一座海外工廠。）"], ["offspring", "n.", 6, "n. 後代、子孫", "The animal protects its offspring.（那隻動物保護牠的後代。）"], ["often", "adv.", 1, "adv. 常常、經常", "I often walk to school.（我常常走路上學。）"], ["oil", "n./v.", 1, "n. 油；v. 給……上油", "Heat some oil in the pan.（在鍋裡加熱一點油。）"], ["OK", "adj./adv./n./v.", 1, "adj. 好的；adv. 好；n. 同意；v. 同意", "\"Is that OK with you?\" \"OK.\"（「這樣可以嗎？」「可以。」）"], ["okay", "adj./adv./n./v.", 1, "adj. 好的；adv. 好吧；n. 同意；v. 同意", "It's okay if you are late.（你遲到也沒關係。）"], ["old", "adj.", 1, "adj. 老的、舊的", "My grandfather is an old man.（我爺爺是一位老人。）"], ["olive", "adj./n.", 5, "adj. 橄欖色的；n. 橄欖", "She likes olive oil on her salad.（她喜歡在沙拉上淋橄欖油。）"], ["omit", "v.", 3, "v. 省略、遺漏", "Don't omit any important details.（不要遺漏任何重要的細節。）"], ["on", "adv./prep.", 1, "adv. 繼續地、在上；prep. 在……上", "The book is on the table.（書在桌上。）"], ["once", "adv./conj./n.", 1, "adv. 一次；conj. 一旦；n. 一次", "I go swimming once a week.（我每週游泳一次。）"], ["ongoing", "adj.", 3, "adj. 進行中的、持續的", "The ongoing project will finish in May.（這項進行中的專案將在五月完成。）"], ["onion", "n.", 3, "n. 洋蔥", "Chopping onions makes me cry.（切洋蔥讓我流淚。）"], ["online", "adj.", 1, "adj. 線上的、網路上的", "I take an online English class.（我上線上英語課。）"], ["only", "adj./adv./conj.", 1, "adj. 唯一的；adv. 僅僅、只；conj. 只是", "She is the only child in her family.（她是家中的獨生女。）"], ["onto", "prep.", 3, "prep. 到……上", "The cat jumped onto the sofa.（貓跳到了沙發上。）"], ["open", "adj./v.", 1, "adj. 開著的、開放的；v. 打開", "Please open the window.（請打開窗戶。）"], ["opera", "n.", 4, "n. 歌劇", "We went to see an opera last night.（我們昨晚去看了一齣歌劇。）"], ["operate", "v.", 2, "v. 操作、運轉、動手術", "Do you know how to operate this machine?（你知道怎麼操作這台機器嗎？）"], ["operation", "n.", 3, "n. 操作、手術、運作", "The doctor performed an operation on him.（醫生為他動了手術。）"], ["operational", "adj.", 5, "adj. 運作中的、營運的", "The new subway line is now operational.（新的捷運路線現已開始營運。）"], ["operative", "adj.", 6, "adj. 有效的、運作的、手術的", "The new rule will become operative next month.（新規定將於下個月生效。）"], ["operator", "n.", 2, "n. 操作員、接線生", "The operator answered the phone.（接線生接起了電話。）"], ["opinion", "n.", 2, "n. 意見、看法", "In my opinion, this book is great.（依我看，這本書很棒。）"], ["opponent", "n.", 5, "n. 對手、反對者", "Our team beat its opponent 3 to 1.（我們的球隊以三比一擊敗了對手。）"], ["opportunity", "n.", 3, "n. 機會", "This is a great opportunity to learn English.（這是學習英語的好機會。）"], ["oppose", "v.", 4, "v. 反對", "Many people oppose the new law.（許多人反對這項新法律。）"], ["opposite", "adj./adv./n./prep.", 3, "adj. 相反的、對面的；adv. 在對面；n. 相反；prep. 在……對面", "The bank is opposite the post office.（銀行在郵局的對面。）"], ["opposition", "n.", 5, "n. 反對、反對黨", "There was strong opposition to the plan.（這項計畫遭到強烈反對。）"], ["oppress", "v.", 6, "v. 壓迫、壓制", "The ruler oppressed his people.（那位統治者壓迫他的人民。）"], ["oppression", "n.", 6, "n. 壓迫、壓制", "The people fought against oppression.（人民奮力反抗壓迫。）"], ["opt", "v.", 5, "v. 選擇、決定", "She opted to study abroad.（她選擇出國留學。）"], ["optimism", "n.", 5, "n. 樂觀、樂觀主義", "His optimism helped him through hard times.（他的樂觀讓他度過艱難的時期。）"], ["optimistic", "adj.", 3, "adj. 樂觀的", "She is optimistic about the future.（她對未來很樂觀。）"], ["option", "n.", 4, "n. 選項、選擇", "You have three options.（你有三個選擇。）"], ["optional", "adj.", 5, "adj. 可選擇的、非必要的", "The trip is optional for students.（這趟旅行對學生來說是自由參加的。）"], ["or", "conj.", 1, "conj. 或者、否則", "Would you like tea or coffee?（你想喝茶還是咖啡？）"], ["oral", "adj./n.", 3, "adj. 口頭的、口腔的；n. 口試", "We have an oral test in English class.（我們英語課有口試。）"], ["orange", "adj./n.", 1, "adj. 橘色的；n. 柳橙、橘色", "She peeled an orange.（她剝了一顆柳橙。）"], ["orbit", "n./v.", 4, "n. 軌道；v. 繞軌道運行", "The moon orbits the Earth.（月球繞著地球運行。）"], ["orchard", "n.", 5, "n. 果園", "We picked apples in the orchard.（我們在果園裡採蘋果。）"], ["orchestra", "n.", 4, "n. 管弦樂團", "She plays the violin in the school orchestra.（她在學校管弦樂團裡拉小提琴。）"], ["ordeal", "n.", 6, "n. 嚴峻的考驗、折磨", "The hostages went through a terrible ordeal.（人質經歷了可怕的折磨。）"], ["order", "n./v.", 1, "n. 順序、訂單、命令；v. 點餐、命令", "I'd like to order a pizza.（我想訂一個披薩。）"], ["orderly", "adj./n.", 6, "adj. 整齊的、有秩序的；n. 勤務兵、護理員", "The students formed an orderly line.（學生們排成整齊的隊伍。）"], ["ordinary", "adj.", 2, "adj. 普通的、平常的", "It was just an ordinary day.（那只是平凡的一天。）"], ["organ", "n.", 2, "n. 器官、風琴", "The heart is an important organ.（心臟是重要的器官。）"], ["organic", "adj.", 3, "adj. 有機的、器官的", "We buy organic vegetables.（我們買有機蔬菜。）"], ["organism", "n.", 5, "n. 生物、有機體", "Bacteria are tiny living organisms.（細菌是微小的生物體。）"], ["organization", "n.", 2, "n. 組織、機構", "She works for a non-profit organization.（她在一個非營利組織工作。）"], ["organize", "v.", 3, "v. 組織、安排、整理", "We will organize a party for her birthday.（我們要為她的生日舉辦一場派對。）"], ["organizer", "n.", 6, "n. 組織者、主辦人", "The organizer of the event thanked everyone.（活動的主辦人感謝了大家。）"], ["orient", "n./v.", 6, "n. 東方；v. 使適應、使朝向", "He had to orient himself in the new city.（他必須在新城市裡熟悉環境。）"], ["oriental", "adj./n.", 6, "adj. 東方的；n. 東方人", "She collects oriental carpets.（她收集東方地毯。）"], ["orientation", "n.", 4, "n. 新生訓練、方向、定位", "The school held an orientation for new students.（學校為新生舉辦了新生訓練。）"], ["origin", "n.", 2, "n. 起源、出身", "The origin of this word is Latin.（這個字的起源是拉丁文。）"], ["original", "adj./n.", 3, "adj. 原來的、有創意的；n. 原作、原件", "Please show me the original document.（請給我看原始文件。）"], ["originality", "n.", 5, "n. 創意、獨創性", "The artist is known for her originality.（那位藝術家以她的獨創性聞名。）"], ["originate", "v.", 6, "v. 起源於、發源", "This tradition originated in China.（這個傳統起源於中國。）"], ["ornament", "n./v.", 6, "n. 裝飾品；v. 裝飾", "They hung ornaments on the Christmas tree.（他們在聖誕樹上掛了裝飾品。）"], ["orphan", "n./v.", 4, "n. 孤兒；v. 使成為孤兒", "The orphan was raised by his aunt.（那個孤兒由他的阿姨撫養長大。）"], ["orphanage", "n.", 6, "n. 孤兒院", "She grew up in an orphanage.（她在孤兒院長大。）"], ["orthodox", "adj.", 6, "adj. 正統的、傳統的", "He prefers orthodox methods to new ones.（比起新方法，他比較喜歡傳統的做法。）"], ["other", "adj./pron.", 1, "adj. 其他的；pron. 其他人、另一個", "Some students like math, and other students like art.（有些學生喜歡數學，其他學生喜歡美術。）"], ["otherwise", "adv.", 4, "adv. 否則、不然", "Hurry up, otherwise you will miss the bus.（快一點，不然你會錯過公車。）"], ["ounce", "n.", 6, "n. 盎司", "The bottle holds sixteen ounces of water.（這個瓶子能裝十六盎司的水。）"], ["our", "pron.", 1, "pron. 我們的", "This is our classroom.（這是我們的教室。）"], ["ours", "pron.", 1, "pron. 我們的（東西）", "That house is ours.（那棟房子是我們的。）"], ["ourselves", "pron.", 1, "pron. 我們自己", "We cleaned the room ourselves.（我們自己打掃了房間。）"], ["out", "adj./adv./n./prep./v.", 1, "adj. 在外的、出局的；adv. 向外；n. 外面；prep. 在……之外；v. 公開、揭露", "The children are playing out in the yard.（孩子們在院子裡玩。）"], ["outbreak", "n.", 6, "n. 爆發、突然發生", "There was an outbreak of flu at schoo const list=document.getElementById('list'),d=document.getElementById('d'),cnt=document.getElementById('cnt');
let cur=-1,shown=[];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase(),lv=document.getElementById('lv').value;
 shown=[];let h='';const so=document.getElementById('sort').value;
 D.forEach((r,i)=>{if(lv&&String(r[2])!==lv)return;if(q&&!r[0].toLowerCase().includes(q)&&!r[3].includes(q))return;shown.push(i)});
 if(so)shown.sort((a,b)=>(so==='asc'?D[a][2]-D[b][2]:D[b][2]-D[a][2])||a-b);
 shown.forEach(i=>{const r=D[i];
  h+=`<div class="row${i===cur?' on':''}" data-i="${i}"><b>${esc(r[0])}</b><span>${esc(r[1])} · L${r[2]}</span></div>`});

}
let voice=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const vsel=document.getElementById('vsel'),rsel=document.getElementById('rate');

 const all=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 vsel.innerHTML='';
 all.forEach((v,i)=>{const o=document.createElement('option');o.value=v.name;
  const tag=/en[-_]GB/i.test(v.lang)?'英式':/en[-_]US/i.test(v.lang)?'美式':/en[-_]AU/i.test(v.lang)?'澳式':v.lang;
  o.textContent=v.name.replace(/^(Microsoft|Google)\s*/,'')+' · '+tag;vsel.appendChild(o)});
 if(!all.length){const o=document.createElement('option');o.textContent='預設英文語音';vsel.appendChild(o)}
 const saved=store.get('voice'),us=all.find(x=>/en[-_]US/i.test(x.lang));
 const v=all.find(x=>x.name===saved)||us||all[0]||null;
 voice=v;if(v)vsel.value=v.name;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
else document.getElementById('warn').style.display='block';
if(/Line\//i.test(navigator.userAgent))document.getElementById('warn').style.display='block';
const sr=store.get('rate');if(sr&&[...rsel.options].some(o=>o.value===sr))rsel.value=sr;

function split(e){const k=e.indexOf('（');return k<0?[e,'']:[e.slice(0,k).trim(),e.slice(k)]}
function speakList(list){
 if(!('speechSynthesis' in window)){alert('此瀏覽器不支援朗讀，請改用 Chrome 或 Safari 直接開啟。');return}
 const go=()=>{if(speechSynthesis.paused)speechSynthesis.resume();
  list.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=+rsel.value;speechSynthesis.speak(u)})};

}
function speak(i){const r=D[i];speakList([r[0],split(r[4])[0]])}
function show(i,play){
 cur=i;const r=D[i],[en,zh]=split(r[4]);

 document.getElementById('b1').onclick=()=>speak(i);
 document.getElementById('b2').onclick=()=>speakList([r[0]]);

list.onclick=e=>{const r=e.target.closest('.row');if(r)show(+r.dataset.i,true)};
